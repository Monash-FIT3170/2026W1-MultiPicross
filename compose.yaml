services:
  traefik:
    image: traefik:v3
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        # dex.multipicross.localhost must resolve to the same place from the api
        # container and from the browser, so the OIDC `iss` claim matches on both
        # sides. The browser resolves *.localhost to 127.0.0.1 -> here; containers
        # resolve it via this alias, also to here. Note curl inside a container
        # forces *.localhost to 127.0.0.1 and cannot reach dex; use node to test.
        aliases: ["dex.multipicross.localhost"]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/18/docker, mount the
      # whole dir or data lands in an anonymous volume instead
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local dev stand-in for the real OIDC provider.
  dex:
    image: dexidp/dex:v2.41.1
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=Host(`dex.multipicross.localhost`)"
      - "traefik.http.routers.dex.entrypoints=web"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"

  api:
    build:
      context: ./api
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ROOM_SECRET: ${JWT_ROOM_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_CLIENT_AUTH: ${OIDC_CLIENT_AUTH}
      OIDC_ANCHOR_CLAIM: ${OIDC_ANCHOR_CLAIM}
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`multipicross.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      # - "traefik.http.routers.api.middlewares=api-strip"
      # - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      # Volumetric per-IP limit on the password-login endpoint only. Method(`POST`)
      # is essential: GET /api/auth/login is the SSO redirect every normal user
      # hits and shares this path, so without the method matcher a shared-NAT
      # network could exhaust 5/min of SSO logins and lock out real users.
      - "traefik.http.routers.api-login.rule=Host(`multipicross.localhost`) && Path(`/api/auth/login`) && Method(`POST`)"
      - "traefik.http.routers.api-login.priority=200"
      - "traefik.http.routers.api-login.service=api"
      - "traefik.http.routers.api-login.entrypoints=web"
      - "traefik.http.routers.api-login.middlewares=login-ratelimit"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.burst=10"
      # depth=0: the VM receives traffic directly with no trustworthy X-Forwarded-For,
      # so keying off a forwarded header would let an attacker spoof past the limit.
      - "traefik.http.middlewares.login-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0"

  gameserver:
    build:
      context: ./gameserver
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      # Not JWT_ACCESS_SECRET: this service is the more exposed one,
      # and that key would let it mint API tokens for any account.
      JWT_ROOM_SECRET: ${JWT_ROOM_SECRET}
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gameserver.rule=Host(`multipicross.localhost`) && PathPrefix(`/gs`)"
      - "traefik.http.routers.gameserver.entrypoints=web"
      - "traefik.http.routers.gameserver.priority=100"
      - "traefik.http.routers.gameserver.middlewares=gameserver-strip"
      - "traefik.http.middlewares.gameserver-strip.stripprefix.prefixes=/gs"
      - "traefik.http.services.gameserver.loadbalancer.server.port=2567"
      # Per-IP limit on the two room endpoints that cost something.
      # /gs/public-rooms is excluded: the lobby polls it every 5s per
      # client, so any useful limit would break normal play.
      - "traefik.http.routers.gs-room-by-code.rule=Host(`multipicross.localhost`) && PathPrefix(`/gs/room-by-code/`)"
      - "traefik.http.routers.gs-room-by-code.priority=200"
      - "traefik.http.routers.gs-room-by-code.service=gameserver"
      - "traefik.http.routers.gs-room-by-code.entrypoints=web"
      - "traefik.http.routers.gs-room-by-code.middlewares=gs-room-ratelimit,gameserver-strip"
      - "traefik.http.routers.gs-create-room.rule=Host(`multipicross.localhost`) && Path(`/gs/create-room`)"
      - "traefik.http.routers.gs-create-room.priority=200"
      - "traefik.http.routers.gs-create-room.service=gameserver"
      - "traefik.http.routers.gs-create-room.entrypoints=web"
      - "traefik.http.routers.gs-create-room.middlewares=gs-room-ratelimit,gameserver-strip"
      - "traefik.http.middlewares.gs-room-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.gs-room-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.gs-room-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.gs-room-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
      - gameserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`multipicross.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # puzzleworker:
  #   build:
  #     context: ./puzzleworker
  #   environment:
  #     DB_HOST: db
  #     DB_USER: ${POSTGRES_USER}
  #     DB_PASSWORD: ${POSTGRES_PASSWORD}
  #     DB_NAME: ${POSTGRES_DB}
  #   depends_on:
  #     - db

volumes:
  pgdata:
