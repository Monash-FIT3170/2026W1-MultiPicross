# Production stack for the GCP Compute Engine host. Self-contained, does not
# extend compose.yaml (which hardcodes multipicross.localhost, publishes
# Postgres on 5432, and enables the insecure Traefik dashboard).
#
# Deployed by infra/files/deploy.sh, which writes this file and a sibling
# .env to /opt/multipicross, then runs:
#   docker compose -f compose.gcp.yaml pull && docker compose -f compose.gcp.yaml up -d
#
# Required in .env: DOMAIN, ACME_EMAIL, ACME_CASERVER, AR_HOST, PROJECT_ID,
#                    IMAGE_TAG, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#                    JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, GS_MONITOR_HTPASSWD,
#                    OIDC_ISSUER, OIDC_PROVIDER_ID, OIDC_CLIENT_ID,
#                    OIDC_CLIENT_SECRET, OIDC_SCOPES, OIDC_CLIENT_AUTH,
#                    OIDC_ANCHOR_CLAIM, OIDC_STATE_SECRET
# Optional in .env:  ADMIN_USERNAME, ADMIN_PASSWORD
#
# No `build:` key anywhere, images are always pulled from Artifact Registry.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    mem_limit: 128m
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # switch to production directory once HTTP-01 is proven
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER}"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/data/letsencrypt:/letsencrypt
    logging: *default-logging

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/data/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  api:
    image: ${AR_HOST}/${PROJECT_ID}/multipicross/api:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_BASE_URL: https://${DOMAIN}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_CLIENT_AUTH: ${OIDC_CLIENT_AUTH}
      OIDC_ANCHOR_CLAIM: ${OIDC_ANCHOR_CLAIM}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    logging: *default-logging

  gameserver:
    image: ${AR_HOST}/${PROJECT_ID}/multipicross/gameserver:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2567/hi"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gameserver.rule=Host(`${DOMAIN}`) && PathPrefix(`/gs`)"
      - "traefik.http.routers.gameserver.entrypoints=websecure"
      - "traefik.http.routers.gameserver.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gameserver.priority=100"
      - "traefik.http.routers.gameserver.middlewares=gameserver-strip"
      - "traefik.http.middlewares.gameserver-strip.stripprefix.prefixes=/gs"
      - "traefik.http.services.gameserver.loadbalancer.server.port=2567"
      - "traefik.http.services.gameserver.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.gameserver.loadbalancer.sticky.cookie.name=gs_backend"
      - "traefik.http.services.gameserver.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.gameserver.loadbalancer.sticky.cookie.httponly=true"
      # defence in depth, app already gates /monitor to non-production
      - "traefik.http.routers.gs-monitor.rule=Host(`${DOMAIN}`) && PathPrefix(`/gs/monitor`)"
      - "traefik.http.routers.gs-monitor.entrypoints=websecure"
      - "traefik.http.routers.gs-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gs-monitor.priority=200"
      - "traefik.http.routers.gs-monitor.middlewares=gs-monitor-auth,gameserver-strip"
      - "traefik.http.routers.gs-monitor.service=gameserver"
      - "traefik.http.middlewares.gs-monitor-auth.basicauth.users=${GS_MONITOR_HTPASSWD}"
    logging: *default-logging

  frontend:
    image: ${AR_HOST}/${PROJECT_ID}/multipicross/frontend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
      - gameserver
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.priority=2"
      - "traefik.http.routers.www.middlewares=www-redirect"
      - "traefik.http.routers.www.service=frontend"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
    logging: *default-logging
