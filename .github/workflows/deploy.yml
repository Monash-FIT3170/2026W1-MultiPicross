name: Deploy

# Builds the three service images, pushes them to Artifact Registry, and
# rolls them out over an IAP-tunnelled SSH connection. Infra is provisioned
# separately with OpenTofu in infra/.
#
# Actions are pinned to commit SHAs, not tags, since this workflow carries an
# OIDC token that reaches billed cloud resources.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to roll out. Leave blank to build this commit. Use to roll back."
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  AR_HOST: australia-southeast1-docker.pkg.dev

jobs:
  build-push:
    name: Build & push (${{ matrix.service }})
    if: ${{ !inputs.image_tag }} # rollback reuses an existing image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for WIF
    strategy:
      matrix:
        service: [api, gameserver, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}
          token_format: access_token # for docker/login-action below

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: true
          tags: |
            ${{ env.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/multipicross/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/multipicross/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Roll out to Compute Engine
    needs: build-push
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Roll out
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
        run: |
          set -euo pipefail

          # deploy.sh validates this again on the host
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo "Refusing to deploy: image_tag is not a valid tag." >&2
            exit 1
          fi

          COMPOSE_B64=$(base64 -w0 compose.gcp.yaml)

          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --strict-host-key-checking=no \
            --command "sudo /opt/multipicross/deploy.sh $IMAGE_TAG $COMPOSE_B64"

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the site is serving
        env:
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          set -uo pipefail
          for path in /api/health /; do
            ok=""
            for _ in $(seq 1 12); do
              if curl -fsS --max-time 10 "https://$DOMAIN$path" >/dev/null; then
                ok=yes
                break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "https://$DOMAIN$path did not respond successfully"
              exit 1
            fi
            echo "OK https://$DOMAIN$path"
          done
